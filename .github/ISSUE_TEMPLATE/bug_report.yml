name: 缺陷报告
description: 报告可复现的使用或开发问题；敏感信息请按 SECURITY.md 处理。
title: '[Bug] '
body:
  - type: input
    id: version
    attributes:
      label: 版本 / 分支与 commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 操作系统、运行环境；生成问题补充显卡、模型和节点版本。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤、预期行为与实际行为
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏错误与验证记录
      description: 不要上传令牌、cookie、个人数据库或私人素材。
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交检查
      options:
        - label: 已移除账号凭据与私人数据。
          required: true
