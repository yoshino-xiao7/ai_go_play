name: Publish GitHub Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Merger-confirmed version, without v (X.Y.Z)'
        required: true
        type: string
      release_pr:
        description: 'Owner-merged integration → main release PR number'
        required: true
        type: string
      confirm:
        description: 'I am the release merger and confirm the version, Windows CI result and disclosed coverage'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: publish-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'yoshino-xiao7/ai_go_play' && github.actor == 'yoshino-xiao7' && github.ref == 'refs/heads/main' && inputs.confirm
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      checks: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_PR: ${{ inputs.release_pr }}
      RELEASE_CONFIRM: ${{ inputs.confirm }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node .github/scripts/release.cjs --validate
      - run: python scripts/check_release.py --release --version "$RELEASE_VERSION"
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: python scripts/package_release.py
      - run: node .github/scripts/release.cjs
