name: Quality
on:
  pull_request:
    branches: [integration, main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  push:
    branches: [dev, integration, main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: quality
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install media tools
        shell: pwsh
        run: |
          if (!(Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress -y
          }
          ffmpeg -version
          ffprobe -version
      - run: python -m pip install -c requirements.lock -e ".[dev]"
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: node --test tests/governance.test.cjs
      - run: python scripts/check_docs.py
      - run: python scripts/check_agent_skills.py
      - run: python scripts/check_release.py
      - name: Validate release candidate before merging main
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: python scripts/check_release.py --release --pull-request
      - name: Build and cold-start the Windows release package
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        shell: pwsh
        timeout-minutes: 15
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'ai-go-play-release'
          python scripts/package_release.py --output $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/check_windows_release.ps1 -PackageDir $output
      - run: python -m pytest -q
