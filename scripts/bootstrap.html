<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>准备 ai-go-play</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#181617;color:#f4eef1;font:15px/1.6 'Segoe UI','Microsoft YaHei',sans-serif;display:grid;place-items:center;padding:30px}.shell{width:min(620px,100%)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:72px;font-weight:600;letter-spacing:.02em}.mark{width:28px;height:28px;border:1px solid #f3abc2;border-radius:8px;display:grid;place-items:center;color:#f3abc2}small{color:#f3abc2;letter-spacing:.16em}h1{font-size:clamp(28px,5vw,42px);font-weight:500;letter-spacing:-.04em;margin:16px 0}p{color:#b6a9af}.track{height:3px;background:#3b3337;margin:36px 0 18px;overflow:hidden}.track span{display:block;background:#f3abc2;height:100%;transition:width .4s;width:4%}.meta{display:flex;justify-content:space-between;color:#b6a9af;font-size:13px}button{background:#f3abc2;border:0;color:#2d1720;padding:12px 22px;border-radius:8px;font:inherit;cursor:pointer;margin-top:24px}button:hover{background:#ffd0df}button:focus-visible{outline:2px solid white;outline-offset:4px}pre{white-space:pre-wrap;word-break:break-word;color:#e5a6ac;background:#242022;border-radius:8px;padding:16px;font-size:12px;max-height:250px;overflow:auto}footer{margin-top:70px;color:#8e8189;font-size:12px}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style><main class="shell"><div class="brand"><span class="mark">↗</span>ai-go-play</div><small>LOCAL CREATIVE WORKSPACE</small><h1>正在准备你的创作空间</h1><p>第一次启动会自动准备运行环境。保持此页面打开，完成后将进入安装向导。</p><div class="track" role="progressbar" aria-label="环境准备进度"><span id="bar"></span></div><div class="meta"><span id="phase" aria-live="polite">正在检查本机环境</span><span id="percent">0%</span></div><pre id="error" hidden></pre><button id="retry" hidden>重试准备环境</button><footer>运行环境保存在项目目录 · 无需手动执行命令</footer></main>
<script>
const phase=document.getElementById('phase'),error=document.getElementById('error'),retry=document.getElementById('retry');
retry.onclick=async()=>{try{const r=await fetch('/retry/__RETRY_TOKEN__',{method:'POST'});if(!r.ok)throw Error('重试请求失败');retry.hidden=true;phase.textContent='正在重试'}catch(e){error.textContent=String(e);error.hidden=false}};
async function poll(){try{const r=await fetch('/status',{cache:'no-store'});if(!r.ok)throw Error();const s=await r.json();phase.textContent=s.phase||'正在准备';const p=Math.round((s.progress||0)*100);document.getElementById('bar').style.width=p+'%';document.getElementById('percent').textContent=p+'%';error.hidden=!s.error;error.textContent=s.error||'';retry.hidden=s.status!=='failed';if(s.status==='ready'&&s.url){location.replace(s.url);return}}catch{phase.textContent='正在连接本机启动服务…'}setTimeout(poll,800)}poll();
</script></html>
