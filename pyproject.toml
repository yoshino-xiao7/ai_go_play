[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "manju-workbench"
version = "0.1.0"
description = "A local canvas and shared media library"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20", "pillow>=11,<14", "httpx>=0.28,<1", "psutil>=6,<8", "websocket-client>=1.8,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
manju = "manju.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
manju = ["schema.sql", "workflow_templates/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
